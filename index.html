<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Face Rig · P3 语音驱动数字人</title>
<style>
  :root {
    --bg: #f3f1ec;
    --panel: #ffffff;
    --ink: #2b2a27;
    --ink-2: #6b6961;
    --ink-3: #9a978d;
    --line: rgba(0, 0, 0, 0.09);
    --line-2: rgba(0, 0, 0, 0.055);
    --blue: #185fa5;
    --pos: #1d9e75;
    --warm: #ba7517;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    background: var(--bg);
    color: var(--ink);
    font: 400 13px/1.55 -apple-system, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .viewport { position: relative; flex: 1 1 auto; min-width: 0; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .hud {
    position: absolute;
    left: 20px; top: 18px;
    pointer-events: none;
    user-select: none;
  }
  .hud h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.01em;
  }
  .hud p {
    margin: 3px 0 0;
    font-size: 12px;
    color: var(--ink-2);
  }
  .hud .row {
    display: flex; gap: 10px; margin-top: 10px;
    font-size: 11.5px; color: var(--ink-3);
  }
  .hud .row span {
    background: rgba(255,255,255,.72);
    border: 0.5px solid var(--line);
    border-radius: 20px;
    padding: 2px 9px;
    backdrop-filter: blur(6px);
  }

  .panel {
    position: relative;
    flex: 0 0 336px;
    width: 336px;
    height: 100%;
    background: var(--panel);
    border-left: 0.5px solid var(--line);
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 18px 18px 40px;
  }
  .panel::-webkit-scrollbar { width: 9px; }
  .panel::-webkit-scrollbar-thumb {
    background: rgba(0,0,0,.14); border-radius: 6px;
    border: 3px solid #fff;
  }

  .panel section { margin-bottom: 22px; }
  .panel h2 {
    margin: 0 0 10px;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--ink-3);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

  .live {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 10px;
    padding: 9px 11px;
    border-radius: 9px;
    background: #f8f7f4;
    border: 0.5px solid var(--line-2);
    font-size: 11px;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .live b {
    flex: 0 0 100%;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    letter-spacing: 0.01em;
  }  .chip {
    appearance: none;
    border: 0.5px solid var(--line);
    background: #fbfaf8;
    color: var(--ink);
    border-radius: 8px;
    padding: 7px 0;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: background .12s, border-color .12s, color .12s;
  }
  .chip:hover { background: #f2f0eb; border-color: rgba(0,0,0,.16); }
  .chip.on {
    background: #e8f1fa;
    border-color: #9dc4e4;
    color: var(--blue);
  }

  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 0;
  }
  .row .name {
    flex: 0 0 84px;
    font-size: 12px;
    color: var(--ink-2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row .val {
    flex: 0 0 34px;
    text-align: right;
    font-size: 11px;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }

  input[type="range"] {
    appearance: none;
    flex: 1 1 auto;
    min-width: 0;
    height: 3px;
    border-radius: 3px;
    background: rgba(0,0,0,.1);
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    appearance: none;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: #fff;
    border: 0.5px solid rgba(0,0,0,.28);
    box-shadow: 0 1px 2px rgba(0,0,0,.14);
  }
  input[type="range"]:active::-webkit-slider-thumb { border-color: var(--blue); }

  .toggle {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 5px 0;
    cursor: pointer;
    font-size: 12.5px;
    color: var(--ink);
  }
  .toggle input { position: absolute; opacity: 0; pointer-events: none; }
  .toggle i {
    position: relative;
    width: 28px; height: 16px;
    border-radius: 20px;
    background: rgba(0,0,0,.13);
    transition: background .16s;
    flex: 0 0 auto;
  }
  .toggle i::after {
    content: "";
    position: absolute;
    left: 2px; top: 2px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.2);
    transition: transform .16s;
  }
  .toggle input:checked + i { background: #1d9e75; }
  .toggle input:checked + i::after { transform: translateX(12px); }

  .groups details {
    border-top: 0.5px solid var(--line-2);
    padding: 5px 0 2px;
  }
  .groups details:first-child { border-top: none; }
  .groups summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    list-style: none;
    padding: 5px 2px;
    font-size: 12.5px;
    color: var(--ink);
  }
  .groups summary::-webkit-details-marker { display: none; }
  .groups summary em {
    font-style: normal;
    font-size: 11px;
    color: var(--ink-3);
  }

  .ghost {
    appearance: none;
    width: 100%;
    margin-top: 12px;
    padding: 8px;
    border: 0.5px solid var(--line);
    border-radius: 8px;
    background: #fbfaf8;
    font: inherit;
    font-size: 12px;
    color: var(--ink-2);
    cursor: pointer;
  }
  .ghost:hover { background: #f2f0eb; color: var(--ink); }

  /* ---------- 对话层 ---------- */
  .chat {
    position: absolute;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    width: min(640px, calc(100% - 48px));
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 4;
    pointer-events: none;
  }
  .say {
    height: 3.4em;
    overflow: hidden;
    font-size: 15.5px;
    line-height: 1.7;
    letter-spacing: 0.01em;
    color: var(--ink);
    text-shadow: 0 1px 14px rgba(255, 255, 255, 0.95), 0 0 3px rgba(255, 255, 255, 0.9);
  }
  .say .caret {
    display: inline-block;
    width: 2px;
    height: 1em;
    margin-left: 1px;
    vertical-align: -0.12em;
    background: var(--ink-3);
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .chatbar {
    pointer-events: auto;
    display: flex;
    gap: 7px;
    align-items: center;
  }
  .chatbar input {
    flex: 1 1 auto;
    min-width: 0;
    height: 34px;
    padding: 0 12px;
    border-radius: 9px;
    border: 0.5px solid var(--line);
    background: rgba(255, 255, 255, 0.86);
    backdrop-filter: blur(10px);
    font: inherit;
    font-size: 13px;
    color: var(--ink);
    outline: none;
    transition: border-color .14s, background .14s;
  }
  .chatbar input:focus { border-color: #9dc4e4; background: #fff; }
  .chatbar input::placeholder { color: var(--ink-3); }
  .btn {
    appearance: none;
    height: 34px;
    padding: 0 14px;
    border-radius: 9px;
    border: 0.5px solid var(--line);
    background: rgba(255, 255, 255, 0.86);
    backdrop-filter: blur(10px);
    font: inherit;
    font-size: 12.5px;
    color: var(--ink);
    cursor: pointer;
    transition: background .12s, color .12s;
  }
  .btn:hover { background: #fff; }
  .btn.primary { background: var(--ink); color: #fff; border-color: transparent; }
  .btn.primary:hover { background: #3a3833; }
  .btn.stop { color: var(--ink-3); }
  .btn.stop:hover { color: #a8402a; }

  .meta {
    display: flex;
    gap: 12px;
    align-items: center;
    font-size: 11px;
    color: var(--ink-3);
    padding-left: 2px;
    min-height: 15px;
  }
  .meta #state[data-s="speaking"] { color: var(--pos); }
  .meta #state[data-s="thinking"] { color: var(--warm); }
  .meta #prov.muted { color: #b08968; }
  .mini {
    margin-left: auto;
    pointer-events: auto;
    appearance: none;
    border: 0.5px solid var(--line);
    background: rgba(255, 255, 255, 0.7);
    border-radius: 6px;
    font: inherit;
    font-size: 10.5px;
    color: var(--ink-2);
    padding: 1px 7px;
    cursor: pointer;
  }
  .mini:hover { background: #fff; }
  .mini.off { color: var(--ink-3); text-decoration: line-through; }
  .mini:disabled { cursor: default; }
  .meta #sndtest { margin-left: 5px; }
  .snd { font-size: 11px; color: var(--ink-3); white-space: nowrap; }
  .snd[data-s="ok"] { color: var(--pos); }
  .snd[data-s="wait"] { color: var(--warm); }
  .snd[data-s="bad"] { color: var(--neg, #c0392b); }

  #loading {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px;
    background: var(--bg);
    color: var(--ink-2);
    font-size: 12.5px;
    transition: opacity .35s;
    z-index: 5;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  .spinner {
    width: 22px; height: 22px;
    border: 1.5px solid rgba(0,0,0,.12);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #error {
    display: none;
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    max-width: 460px;
    white-space: pre-wrap;
    background: #fdf3f2;
    border: 0.5px solid #e8c4c1;
    color: #712b13;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 12.5px;
    z-index: 6;
  }
</style>
</head>
<body>
  <div class="viewport">
    <canvas id="stage"></canvas>
    <div class="hud">
      <h1>Face Rig · P6</h1>
      <p>ARKit 52 blendshape · 本地 Qwen2.5-7B · 文本情绪推断 · 音素级唇形 · TTS 音频时钟</p>
      <div class="row">
        <span id="fps">— fps</span>
        <span id="active">—</span>
        <span id="expr">表情 —</span>
        <span id="channels">加载中</span>
      </div>
      <div class="row"><span id="missing" style="display:none"></span></div>
    </div>
    <div id="loading"><div class="spinner"></div><div>加载头部模型…</div></div>
    <div id="error"></div>
    <div class="chat">
      <div class="say"><span id="say-text"></span><b class="caret"></b></div>
      <div class="chatbar">
        <input id="ask" type="text" placeholder="说点什么…（Enter 发送）" autocomplete="off" spellcheck="false" />
        <button id="send" class="btn primary">发送</button>
        <button id="stop" class="btn stop">打断</button>
      </div>
      <div class="meta">
        <span id="prov">—</span>
        <span id="state" data-s="idle">待机</span>
        <span id="lat"></span>
        <span id="snd" class="snd" title="音频状态">音频 —</span>
        <button id="mute" class="mini">声音</button>
        <button id="sndtest" class="mini">试听</button>
      </div>
    </div>
  </div>
  <aside class="panel" id="panel"></aside>
  <script type="module" src="bundle.js"></script>
</body>
</html>
